<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Monitor Kiwify</title>

    <meta name="description" content="Painel para monitorar vendas da Kiwify">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <div class="logo">

        💰 Monitor Kiwify

    </div>

</header>

<main class="container">

    <section class="cards">

        <div class="card">

            <h3>Total Vendido</h3>

            <p id="totalVendido">R$ 0,00</p>

        </div>

        <div class="card">

            <h3>Em Garantia</h3>

            <p id="garantia">0</p>

        </div>

        <div class="card">

            <h3>Último Dia</h3>

            <p id="ultimoDia">0</p>

        </div>

        <div class="card">

            <h3>Garantia Encerrada</h3>

            <p id="encerradas">0</p>

        </div>

    </section>

    <section class="tabela">

        <h2>Últimas Vendas</h2>

        <table>

            <thead>

                <tr>

                    <th>Cliente</th>

                    <th>Produto</th>

                    <th>Valor</th>

                    <th>Compra</th>

                    <th>Dias</th>

                    <th>Status</th>

                </tr>

            </thead>

            <tbody id="listaVendas">

                <tr>

                    <td colspan="6">

                        Nenhuma venda encontrada.

                    </td>

                </tr>

            </tbody>

        </table>

    </section>

</main>

<footer>

    Monitor Kiwify © 2026

</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase/config.js"></script>
<script src="supabase/service.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase/config.js"></script>
<script src="supabase/service.js"></script>
<script src="app.js"></script>

</body>

</html>
